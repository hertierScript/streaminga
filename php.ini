; Custom PHP configuration for Laravel development
; This file overrides CLI PHP settings for the project

; File upload settings
upload_max_filesize = 500M
post_max_size = 510M
max_file_uploads = 20

; Memory and execution time
memory_limit = 512M
max_execution_time = 600
max_input_time = 600

; Other settings
display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT